name: exchange-portfolio

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "atlas-ledger-backend"

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "atlas-ledger-frontend"

  gateway:
    build:
      context: ./gateway
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "0.0.0.0:8000:80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "atlas-ledger-gateway"

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24
